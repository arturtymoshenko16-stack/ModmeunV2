name: Android APK build

on:
  workflow_dispatch:
    inputs:
      archive:
        description: ZIP archive to build
        required: true
        type: choice
        options:
          - MOD_MENU_cloud_build.zip
          - MOD_MENU_final_v14.zip
          - NEW_final.zip
        default: MOD_MENU_cloud_build.zip

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.1.8937393"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Extract selected project archive
        env:
          ARCHIVE: ${{ inputs.archive }}
        run: |
          test -f "$ARCHIVE" || { echo "Archive not found: $ARCHIVE"; exit 1; }
          mkdir -p source
          unzip -q "$ARCHIVE" -d source

      - name: Locate Android Gradle project
        run: |
          PROJECT_FILE="$(find source -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE="$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          fi
          if [ -z "$PROJECT_FILE" ]; then
            echo "No Gradle project was found in the selected archive."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Collect build outputs
        run: |
          mkdir -p output
          find "$PROJECT_DIR" -type f -name '*.apk' -path '*/build/outputs/apk/*' -exec cp {} output/ \;
          find "$PROJECT_DIR" -type f -name '*.so' -path '*/build/*' -exec cp {} output/ \;
          echo "Collected files:"
          ls -lah output
          test -n "$(find output -type f -print -quit)" || { echo "No APK or native library was produced."; exit 1; }

      - name: Upload APK and native libraries
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: output/
          if-no-files-found: error
