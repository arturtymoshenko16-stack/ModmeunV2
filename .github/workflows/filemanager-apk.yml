name: Build File manager

run-name: Build File manager ${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    paths:
      - 'FileManagerAPK/**'
      - '.github/workflows/filemanager-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in Android SDK"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: FileManagerAPK
        run: gradle assembleDebug --no-daemon

      - name: Prepare 32-bit and 64-bit APK files
        run: |
          mkdir -p release
          cp FileManagerAPK/app/build/outputs/apk/debug/app-debug.apk release/FileManagerAPK-32bit.apk
          cp FileManagerAPK/app/build/outputs/apk/debug/app-debug.apk release/FileManagerAPK-64bit.apk
          cd release
          zip FileManagerAPK-32bit-64bit.zip FileManagerAPK-32bit.apk FileManagerAPK-64bit.apk

      - name: Upload APK files and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FileManagerAPK-32bit-64bit
          path: |
            release/FileManagerAPK-32bit.apk
            release/FileManagerAPK-64bit.apk
            release/FileManagerAPK-32bit-64bit.zip
          if-no-files-found: error
