plugins {
    id 'com.android.application'
}

android {
    namespace 'com.script.filemanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.script.filemanager'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
